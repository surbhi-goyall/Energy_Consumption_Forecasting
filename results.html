<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 40px;
            background-color: #f8f9fa;
        }
        h1, h3 {
            text-align: center;
            margin-bottom: 30px;
        }
        .tips {
            margin-top: 30px;
        }
        .tips li {
            background-color: #e2f0d9;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #4caf50;
            list-style-type: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Energy Consumption Forecast</h1>

        <div class="table-responsive">
            {{ tables | safe }}
        </div>
        


        <div class="tips">
            <h3>💡 Energy Saving Tips</h3>
            <ul>
                {% for tip in tips %}
                    <li>{{ tip }}</li>
                {% endfor %}
            </ul>
        </div>


        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary">Upload Another File</a>
        </div>
    </div>

</body>
</html>
